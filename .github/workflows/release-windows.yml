name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG must match package version v$version."
          }

      - run: npm ci

      - name: Build installer
        run: npm run electron:ensure && npm run check && npx --no-install electron-builder --win --x64 --publish never

      - name: Verify Electron fuses
        run: npm run verify:fuses

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem 'dist' -File | Where-Object {
              $_.Extension -in '.exe', '.blockmap', '.yml'
            } | ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) {
            throw 'No release assets were produced.'
          }

          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG already exists and is published."
            }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              --draft `
              --generate-notes `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TAG `
              @assets
          }
